# Deploy do frontend na Netlify.
# Os caminhos de "command" e "publish" são relativos à pasta "base".

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Encaminha as chamadas de API para o NestJS no Render. O navegador fala apenas com
# o domínio do site, o que evita CORS e mantém os cookies de sessão na mesma origem.
[[redirects]]
  from = "/api/*"
  to = "https://amplifica.onrender.com/api/:splat"
  status = 200
  force = true

# SPA: qualquer outra rota devolve o index.html e o React Router assume.
# Precisa ser a última regra.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
